name: Validate V034 Comparacion V5 ORA
on:
  push:
    branches: [experiment/v014034-comparacion-v5-ora-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check original V5 and V033 result integration
        run: |
          set -euo pipefail
          node --check genesis_comparacion_v032.js
          node --check preparacion_control.js
          node --check genesis_result_dynamic_v001.js
          node --test tests/comparacion_v032_inventory.test.cjs
          node tests/mercenary_ml08_slot_ora.cjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('preparacion_control.js').read_text()
          h=Path('index.html').read_text()
          assert "tab==='Comparacion'&&ctx.getItems&&window.GenesisComparacionV032?.render" in s
          assert "genesis_comparacion_v032.js?v=034" in h
          assert "renderGenesisResultV033(item)" in h
          assert all(Path('assets/ui/resultado/oras/'+f).is_file() for f in ['01_Base.png','02_Luz.png','03_Sombra.png','04_Fuego.png','05_Hielo.png','06_Naturaleza.png','07_Tierra.png','08_Rayo.png'])
          print('V034 static integration PASS')
          PY
