name: Publish isolated V033 approved result preview (deployment)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v033-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: genesis-preview-v033
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: experiment/v014033-resultado-creaciones-v4-20261109
          path: v033
          persist-credentials: false
      - name: Verify V033 approved module and retained V031 systems
        run: |
          set -euo pipefail
          test -s v033/index.html
          test -s v033/modules/genesis_result_dynamic_v001.js
          (cd v033 && node --check genesis_result_dynamic_v001.js)
          node --check v033/mercenary_4t_runtime_ml06.js
          grep -q 'renderGenesisApprovedResultV033(item)' v033/index.html
          grep -q 'genesisCompareORA' v033/preparacion_control.js
      - name: Copy independent V033 snapshot
        run: |
          set -euo pipefail
          mkdir -p site/v033
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='reference/' v033/ site/v033/
          test -s site/v033/index.html
          printf 'Experimental V033: approved result module; not visually approved as complete game.\n' > site/v033/PREVIEW_STATUS.txt
      - name: Publish without modifying original game or Pages root
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v033
          git diff --cached --quiet && exit 0
          git commit -m 'preview: publish independent V033 dynamic ORA creation result'
          git push origin HEAD:gh-pages
