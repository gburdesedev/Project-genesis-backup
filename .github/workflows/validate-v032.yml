name: V014.032 Comparacion V5 / QA de inventario real
on:
  push:
    branches:
      - experiment/v014032-comparacion-v05-inventario-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-v032:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks and inventory-domain tests
        shell: bash
        run: |
          set -euo pipefail
          node --check preparacion_control.js
          node --check genesis_comparacion_v032.js
          node --check mercenary_4t_runtime_ml06.js
          node --test tests/comparacion_v032_inventory.test.cjs
      - name: Verify real approved ORA PNG integrity, V032 runtime hooks and build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('assets/ui/resultado/oras')
          manifest=json.loads((root/'manifest.sha256.json').read_text())
          names=['Base','Luz','Sombra','Fuego','Hielo','Naturaleza','Tierra','Rayo']
          assert [x['name'] for x in manifest['channels']]==names
          for x in manifest['channels']:
              art=root/x['png']
              assert art.exists(),art
              assert hashlib.sha256(art.read_bytes()).hexdigest()==x['png_sha256'],art
          tabs=Path('assets/ui/preparacion/01_Capas/Pestanas')
          for name in ['Inventario','Preparacion','Fabricaciones','Comparacion']:
              assert (tabs/f'Pestana_{name}.png').exists()
          prep=Path('preparacion_control.js').read_text()
          assert "if(tab==='Comparacion'&&ctx.getItems&&renderComparisonV032(ctx))return;" in prep
          html=Path('index.html').read_text()
          assert 'Project Genesis v0.14.032' in html
          assert 'BUILD 20261109.032' in html
          assert Path('genesis_comparacion_v032.css').exists()
          assert Path('genesis_comparacion_v032.js').exists()
          print('PASS ORA SHA256 + version + V032 lazy-load hook. No data mocks in game.')
          PY
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install chromium --with-deps
      - name: Browser smoke test with isolated QA-only fixture
        run: node tests/comparacion_v032_browser.mjs
      - name: Upload screenshots and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-v032-capturas-diagnostico
          path: reports/v032-comparacion/
          if-no-files-found: ignore
