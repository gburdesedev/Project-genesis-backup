name: V20.007 isolated unified comparison shield and result
# Regression pass: recovered renderer may add a standalone V12B GLB adapter.
# Explicit V007 rebuild requested; preserve stable main and previous V006 candidates.
# Presentation rebuild 2026-11-10: freeze checkpoint first, rerun QA and publish preview only.
# Escort test refresh: plaza shade, fountain collider, bypass route, merchant V02 GLB.
# Water/merchant follow-up: restore plaza trees, correct market NPC position and missing fountain runtime.
# Merchant stall anchor: verify world-bounds centering and same origin for merchant and counter.
# Real-browser QA follow-up: inspect GLB render bounds, not just GLB bytes.
# Fix confirmed by failed browser test: Entity.worldToLocal is not a PlayCanvas API; use inverse world matrix.
# Browser QA found quantized AABB ~15 km: use authored GLB scale instead of auto-normalization.
on:
  push:
    branches: [experiment/v20-007-unified-comparison-result-20261109]
    paths: ['.github/workflows/publish-v20-007-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: genesis-v20-007-unified-preview
  cancel-in-progress: false
jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/v20-007-unified-comparison-result-20261109
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: true
      - name: Verify unified V007, independent of stable main
        run: |
          set -euo pipefail
          cd candidate
          node --check genesis_market_quest_v001.js
          node --check village_trees.js
          node --check genesis_market_v001.js
          node --check previews/genesis-v038-fuente-hq-runtime.js
          node --check village_world.js
          node --check genesis_comparacion_v032.js
          node --check preparacion_control.js
          node --check genesis_fabricacion_modular_v004.js
          node --check modules/resultado_v016001/genesis_result_dynamic_v001.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=html.split('<script').slice(1)
            .map(x=>x.split('</script>')[0])
            .filter(x=>{const h=x.slice(0,x.indexOf('>'));return !h.includes('src=')&&!h.includes('application/json')&&!h.includes('importmap');});
          for(const [i,script] of scripts.entries()){
            const header=script.slice(0,script.indexOf('>'));
            const body=script.slice(script.indexOf('>')+1);
            if(!body.trim())continue;
            if(header.includes('type="module"')){
              const tmp='/tmp/genesis-inline-'+i+'.mjs';
              fs.writeFileSync(tmp,body);
              require('child_process').execFileSync('node',['--check',tmp],{stdio:'pipe'});
            }else new vm.Script(body,{filename:'index.html:inline-script'});
          }
          if(!scripts.length)throw Error('No inline scripts found to parse');
          console.log('V007_INLINE_JS_SYNTAX_PASSED',scripts.length);
          JS
          node --test modules/resultado_v016001/test_recovered_result.cjs
          node --test tests/v20_006_result_integration.cjs
          test -s assets/playcanvas/approved/characters/merchant_v02_75962.glb
          test -s assets/ui/fabricaciones_ora_v004/escudo_hierro_v015_PBR2K_WEBP_v022.glb
          test -s assets/ui/fabricaciones_ora_v004/V015_REAL_SHIELD_ICON_RGBA.png
          test -s assets/ui/resultado/oras/08_Rayo.png
          test -s assets/playcanvas/approved/equipment/espada_v03_hierro_v175_v12b_cycles_hdri32.png
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          glb=Path('assets/ui/fabricaciones_ora_v004/escudo_hierro_v015_PBR2K_WEBP_v022.glb').read_bytes()
          assert glb[:4]==b'glTF' and struct.unpack_from('<I',glb,4)[0]==2
          assert struct.unpack_from('<I',glb,8)[0]==len(glb)
          n,t=struct.unpack_from('<I4s',glb,12)
          assert t==b'JSON' and json.loads(glb[20:20+n]).get('meshes')
          html=Path('index.html').read_text()
          comparison=Path('genesis_comparacion_v032.js').read_text()
          assert "escudo_hierro:'./assets/ui/fabricaciones_ora_v004/escudo_hierro_v015_PBR2K_WEBP_v022.glb'" in html
          assert 'V015_REAL_SHIELD_ICON_RGBA.png' in comparison
          assert 'espada_v03_hierro_v175_v12b_cycles_hdri32.png' in comparison
          assert 'modules/resultado_v016001/genesis_result_dynamic_v001.js?v=20.007' in html
          assert 'GenesisResultDynamic.decorate(modalBox,item,itemAssetMarkup)' in html
          assert 'project-genesis-backup-v20.007-candidate' in html
          assert "startOrdanMarketEscort();toast('PRUEBA V20.007" in html
          assert 'Math.hypot(x-7,z-16)<3.3+r' in html
          quest=Path('genesis_market_quest_v001.js').read_text()
          assert '{x:16.2,z:16.0}' in quest
          merchant=Path('genesis_market_v001.js').read_text()
          assert 'merchant_v02_75962.glb' in merchant
          assert 'const POS = STALL;' in merchant
          assert 'inverseParent.transformPoint(desired,new Vec3())' in merchant
          assert 'inverseParent.transformPoint(current,new Vec3())' in merchant
          assert 'merchant-quantized-scale' in html
          assert 'const approvedScale=.92;' in merchant
          assert 'NEVER derive a scale or placement from that runtime AABB' in merchant
          trees=Path('village_trees.js').read_text()
          assert "['maple',11.8,11.7,'plaza']" in trees
          assert "node.site.region!=='plaza'" not in trees
          fountain=Path('previews/genesis-v038-fuente-hq-runtime.js').read_text()
          assert "AGUA_" in fountain and 'new StandardMaterial()' in fountain
          assert '20.007-water-corrected' in html
          merchant_glb=Path('assets/playcanvas/approved/characters/merchant_v02_75962.glb').read_bytes()
          assert merchant_glb[:4]==b'glTF' and struct.unpack_from('<I',merchant_glb,8)[0]==len(merchant_glb)
          n,t=struct.unpack_from('<I4s',merchant_glb,12)
          merchant_json=json.loads(merchant_glb[20:20+n])
          assert t==b'JSON' and merchant_json.get('meshes')
          nodes=merchant_json.get('nodes',[])
          mesh_nodes=[{'name':node.get('name',''), 'translation':node.get('translation'), 'scale':node.get('scale'), 'matrix':node.get('matrix')} for node in nodes if 'mesh' in node]
          accessors=merchant_json.get('accessors',[])
          pos_accessors=[]
          for mesh in merchant_json.get('meshes',[]):
              for primitive in mesh.get('primitives',[]):
                  idx=primitive.get('attributes',{}).get('POSITION')
                  if idx is not None:
                      a=accessors[idx];pos_accessors.append({'min':a.get('min'),'max':a.get('max')})
          print('MERCHANT_V02_GLTF_DIAGNOSTIC',json.dumps({'nodes':len(nodes),'mesh_nodes':mesh_nodes[:8],'position_accessors':pos_accessors[:8]},ensure_ascii=False))
          print('V007_UNIFIED_STATIC_QA_PASSED')
          PY
          test -s ../site/index.html
      - name: Publish V007 in its own preview directory
        run: |
          set -euo pipefail
          mkdir -p site/v20-007
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='preview/' --exclude='reference/' --exclude='qa-results/' candidate/ site/v20-007/
          test -s site/v20-007/index.html
          printf 'V20.007 experimental unified candidate; automatic QA required; runtime visual approval pending. Not integrated to main.\n' > site/v20-007/PREVIEW_STATUS.txt
      - name: Commit preview only, not the stable root
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v20-007
          git diff --cached --quiet && exit 0
          git commit -m 'preview(v20.007): unified result, comparison and V015 shield'
          git push origin HEAD:gh-pages

      - name: Verify actual merchant V02 in headless PlayCanvas
        id: merchant_browser
        run: |
          cd candidate
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/v20_007_merchant_browser.cjs
      - name: Save merchant V02 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-007-merchant-real-browser-qa
          path: candidate/reports/v20-007-merchant/
          if-no-files-found: warn
